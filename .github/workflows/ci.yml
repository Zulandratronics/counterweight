name: CI — Counterweight

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Python test suite
        run: pytest
      - name: Verify CLI smoke test
        run: |
          echo "According to Smith et al. (2025), however, sample sizes remain modest (n=120)." | counterweight-audit --json

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run zero-dependency JS engine tests
        run: node --test tests/engine.test.mjs
